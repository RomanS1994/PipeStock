services:
  - type: web
    name: pipestock
    runtime: node
    region: frankfurt
    branch: main
    buildCommand: npm install --include=dev && npm --prefix backend install --include=dev && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Prague
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
